# Copy to .secrets/alertmanager.yml and set an actual on-call receiver before deployment.
global:
  resolve_timeout: 5m
route:
  receiver: oncall
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: oncall
    webhook_configs:
      - url: https://REPLACE-WITH-REAL-ONCALL-ENDPOINT.invalid/alerts
        send_resolved: true
