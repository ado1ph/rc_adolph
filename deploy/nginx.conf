worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=admission:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    upstream delivery_api {
        zone delivery_api 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        server api:9000 resolve;
        keepalive 16;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 256k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        keepalive_timeout 10s;
        limit_req_status 429;
        limit_conn_status 429;
        location = /metrics { return 404; }
        location / {
            limit_req zone=admission burst=20 nodelay;
            limit_conn connections 20;
            proxy_pass http://delivery_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_next_upstream off;
        }
    }
}
