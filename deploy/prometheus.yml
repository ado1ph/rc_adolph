global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: notifier
    authorization:
      type: Bearer
      credentials_file: /run/notifier/metrics-token
    static_configs:
      - targets: [api:9000]
