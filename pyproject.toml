[project]
name = "rc_adolph"
version = "0.2.0"
description = "Durable supplier API delivery with PostgreSQL and a local demonstration"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
production = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary,pool]>=3.2,<4",
    "cryptography>=44", "dnspython>=2.7,<3", "prometheus-client>=0.21,<1",
]
test = ["httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notifier*"]

[tool.setuptools.package-data]
"notifier.production" = ["schema.sql", "migrations/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
