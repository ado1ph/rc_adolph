name: delivery-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: notifier
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d notifier"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NOTIFY_TEST_DATABASE_URL: postgresql://postgres:integration-only-password@127.0.0.1:5432/notifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes -r requirements-test.lock
      - run: pip check
      - run: ruff check notifier/production tests/test_production.py tests/test_init_config.py scripts/init_config.py
      - run: python -m unittest discover -s tests -v
      - name: Validate Prometheus alert rules
        run: |
          docker run --network none --rm --entrypoint=/bin/promtool \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62 \
            check rules deploy/alerts.yml
          docker run --network none --rm --entrypoint=/bin/promtool \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62 \
            test rules tests/alerts.test.yml
      - run: python -m notifier demo
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: docker build -t notifier:ci .
